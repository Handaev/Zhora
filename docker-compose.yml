version: "3"

services:
  app:
    image: 'app:1'
    container_name: 'app'
    depends_on:
      - minio
    ports:
      - 8080:8080
    networks:
      - app-zhora
  minio:
    image: 'minio/minio:latest'
    container_name: 'minio'
    ports:
        - 9000:9000
    environment:
      MINIO_ROOT_USER: jora
      MINIO_ROOT_PASSWORD: jora
    networks:
      app-zhora:
    volumes:
      - minio_data

volumes:
  minio_data:

networks:
  app-zhora:
    driver: bridge